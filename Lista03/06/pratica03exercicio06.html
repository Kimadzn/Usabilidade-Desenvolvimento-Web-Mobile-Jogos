<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculadora Juros Compostos</title>

    <link rel="stylesheet" href="pratica03exercicio06.css">
    <script src="pratica03exercicio06.js"></script>
</head>

<body>

    <h1>Calculadora de Juros Compostos</h1>

    <label for="valorInicial">Valor inicial:</label>
    <input type="number" id="valorInicial" placeholder="Valor">

    <label for="taxa">Taxa de juros (%):</label>
    <input type="number" id="taxa" placeholder="Taxa">

    <label for="tempo">Tempo:</label>
    <input type="number" id="tempo" placeholder="Tempo">

    <button onclick="calcularJuros()">Calcular</button>

    <div id="resultado"></div>

</body>
